# Stockbots: three AI trading bots on Alpaca. Paper trading by default.
# Hostinger: deploy this file with Docker Manager, then open the server's address.
# Anywhere else: `docker compose up -d` in the folder holding this file.
name: stockbots

services:
  app:
    image: ghcr.io/chillysoop/stockbots:latest
    restart: unless-stopped
    environment:
      # Optional. Everything below has a safe default; keys are normally pasted on the Setup page.
      MODE: ${MODE:-paper}
      LIVE_ACK: ${LIVE_ACK:-}
      TICK_SECONDS: ${TICK_SECONDS:-60}
      MODEL_DAILY_USD_CAP: ${MODEL_DAILY_USD_CAP:-1}
      DAILY_LOSS_STOP_PCT: ${DAILY_LOSS_STOP_PCT:-3}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      SETUP_WINDOW_MIN: ${SETUP_WINDOW_MIN:-120}
      MAX_EXPOSURE_PCT: ${MAX_EXPOSURE_PCT:-100}
      # Blank = the built-in default (see the README's Settings table)
      MAX_POSITION_USD: ${MAX_POSITION_USD:-}
      MIN_PRICE: ${MIN_PRICE:-}
      REENTRY_COOLDOWN_MIN: ${REENTRY_COOLDOWN_MIN:-}
      ENTRY_START_ET: ${ENTRY_START_ET:-}
      ENTRY_END_ET: ${ENTRY_END_ET:-}
      FALLBACK_OPENS_TRADES: ${FALLBACK_OPENS_TRADES:-}
      MAX_MENU_ENTRIES: ${MAX_MENU_ENTRIES:-}
      MODEL_MIN_INTERVAL_SEC: ${MODEL_MIN_INTERVAL_SEC:-}
      MODEL_TIMEOUT_SEC: ${MODEL_TIMEOUT_SEC:-}
      JEV_USD_PER_MTOK: ${JEV_USD_PER_MTOK:-}
      CLAUDE_USD_PER_MTOK_IN: ${CLAUDE_USD_PER_MTOK_IN:-}
      CLAUDE_USD_PER_MTOK_OUT: ${CLAUDE_USD_PER_MTOK_OUT:-}
      OPENAI_USD_PER_MTOK_IN: ${OPENAI_USD_PER_MTOK_IN:-}
      OPENAI_USD_PER_MTOK_OUT: ${OPENAI_USD_PER_MTOK_OUT:-}
      DATA_FEED: ${DATA_FEED:-}
      DAILY_FEED: ${DAILY_FEED:-}
      CLOSED_REFRESH_SECONDS: ${CLOSED_REFRESH_SECONDS:-}
      # Forgot the owner password? Set this (8+ characters), redeploy, log in with it.
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Wash-sale guard across all bots and brokers: auto = on for real money, off on paper
      WASH_SALE_GUARD: ${WASH_SALE_GUARD:-auto}
      WASH_SALE_GROUPS: ${WASH_SALE_GROUPS:-SPY,VOO,IVV,SPLG;QQQ,QQQM;GOOGL,GOOG;BRK.B,BRK.A}
      # ---- Real money only (MODE=live + LIVE_ACK). One broker per bot: alpaca, tradier, public or off.
      # Claude Trend
      LIVE_BROKER_CLAUDE: ${LIVE_BROKER_CLAUDE:-alpaca}
      ALPACA_LIVE_KEY_CLAUDE: ${ALPACA_LIVE_KEY_CLAUDE:-}
      ALPACA_LIVE_SECRET_CLAUDE: ${ALPACA_LIVE_SECRET_CLAUDE:-}
      TRADIER_TOKEN_CLAUDE: ${TRADIER_TOKEN_CLAUDE:-}
      TRADIER_ACCOUNT_CLAUDE: ${TRADIER_ACCOUNT_CLAUDE:-}
      PUBLIC_SECRET_CLAUDE: ${PUBLIC_SECRET_CLAUDE:-}
      PUBLIC_ACCOUNT_CLAUDE: ${PUBLIC_ACCOUNT_CLAUDE:-}
      # Jev Dips
      LIVE_BROKER_JEV: ${LIVE_BROKER_JEV:-alpaca}
      ALPACA_LIVE_KEY_JEV: ${ALPACA_LIVE_KEY_JEV:-}
      ALPACA_LIVE_SECRET_JEV: ${ALPACA_LIVE_SECRET_JEV:-}
      TRADIER_TOKEN_JEV: ${TRADIER_TOKEN_JEV:-}
      TRADIER_ACCOUNT_JEV: ${TRADIER_ACCOUNT_JEV:-}
      PUBLIC_SECRET_JEV: ${PUBLIC_SECRET_JEV:-}
      PUBLIC_ACCOUNT_JEV: ${PUBLIC_ACCOUNT_JEV:-}
      # Codex Momentum
      LIVE_BROKER_OPENAI: ${LIVE_BROKER_OPENAI:-alpaca}
      ALPACA_LIVE_KEY_OPENAI: ${ALPACA_LIVE_KEY_OPENAI:-}
      ALPACA_LIVE_SECRET_OPENAI: ${ALPACA_LIVE_SECRET_OPENAI:-}
      TRADIER_TOKEN_OPENAI: ${TRADIER_TOKEN_OPENAI:-}
      TRADIER_ACCOUNT_OPENAI: ${TRADIER_ACCOUNT_OPENAI:-}
      PUBLIC_SECRET_OPENAI: ${PUBLIC_SECRET_OPENAI:-}
      PUBLIC_ACCOUNT_OPENAI: ${PUBLIC_ACCOUNT_OPENAI:-}
      # ---- Optional paper test of Tradier: PAPER_BROKER_<BOT>=tradier with a sandbox token
      PAPER_BROKER_CLAUDE: ${PAPER_BROKER_CLAUDE:-alpaca}
      PAPER_BROKER_JEV: ${PAPER_BROKER_JEV:-alpaca}
      PAPER_BROKER_OPENAI: ${PAPER_BROKER_OPENAI:-alpaca}
      TRADIER_SANDBOX_TOKEN_CLAUDE: ${TRADIER_SANDBOX_TOKEN_CLAUDE:-}
      TRADIER_SANDBOX_TOKEN_JEV: ${TRADIER_SANDBOX_TOKEN_JEV:-}
      TRADIER_SANDBOX_TOKEN_OPENAI: ${TRADIER_SANDBOX_TOKEN_OPENAI:-}
    volumes:
      - bots-data:/data
    expose:
      - "8000"

  web:
    # Caddy in front: plain HTTP on the server's IP, or automatic HTTPS once
    # PUBLIC_DOMAIN is set to a domain that points at this server.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from ${PUBLIC_DOMAIN:-:80} --to app:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bots-data:
  caddy-data:
  caddy-config:
